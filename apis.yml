aid: neo4j
name: Neo4j
description: >-
  Neo4j is the leading graph database platform, enabling developers to build applications powered by connected data.
  Their developer platform provides HTTP, Query, and Aura cloud APIs alongside official drivers for Python, Java, and
  JavaScript, as well as a GraphQL library for rapid API development backed by the Neo4j graph database.
