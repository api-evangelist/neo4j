apis:
- aid: neo4j:query-api
  name: Neo4j Query API
  description: >-
    The Neo4j Query API enables the execution of Cypher statements against a Neo4j server through HTTP
    requests. It provides a streamlined interface for running graph database queries, supporting both
    self-managed and cloud-hosted Neo4j instances. The Query API is designed for applications that need
    to interact with Neo4j programmatically and is particularly useful for languages where a dedicated
    Neo4j driver is not available.
  humanURL: https://neo4j.com/docs/query-api/current/
  tags:
  - Graph Database
  - Cypher
  - Query
  - HTTP
  - Database
  properties:
  - type: Documentation
    url: https://neo4j.com/docs/query-api/current/
  - type: OpenAPI
    url: openapi/neo4j-query-api-openapi.yml
- aid: neo4j:graphql-library
  name: Neo4j GraphQL Library
  description: >-
    The Neo4j GraphQL Library is an open source JavaScript library that enables rapid development of GraphQL
    APIs backed by a Neo4j graph database. It automatically generates a single optimized Cypher query
    for each GraphQL query or mutation, eliminating the N+1 problem common in GraphQL implementations.
    The library supports schema-first development and integrates with Neo4j AuraDB for cloud-hosted deployments,
    making it suitable for cross-platform and mobile applications.
  humanURL: https://neo4j.com/docs/graphql/current/
  tags:
  - GraphQL
  - Graph Database
  - JavaScript
  - Low-Code
  - API Development
  properties:
  - type: Documentation
    url: https://neo4j.com/docs/graphql/current/
  - url: graphql/neo4j-graphql.md
    type: GraphQL
- aid: neo4j:bolt-protocol
  name: Neo4j Bolt Protocol
  description: >-
    The Neo4j Bolt Protocol is a binary application protocol designed for efficient execution of database
    queries using the Cypher query language. It operates over TCP or WebSocket connections on the default
    port 7687 and serves as the foundation for all official Neo4j drivers including Java, Python, JavaScript,
    .NET, and Go. The protocol supports both direct connections via the bolt:// scheme and routing connections
    via bolt+routing:// for clustered deployments.
  humanURL: https://neo4j.com/docs/bolt/current/bolt/
  tags:
  - Binary Protocol
  - Graph Database
  - Drivers
  - Connectivity
  - Networking
  properties:
  - type: Documentation
    url: https://neo4j.com/docs/bolt/current/bolt/
- aid: neo4j:python-driver
  name: Neo4j Python Driver
  description: >-
    The Neo4j Python Driver is the official library for interacting with Neo4j graph databases from Python
    applications. It communicates using the Bolt protocol and supports both single instance and clustered
    database deployments. The driver is available on PyPI as the neo4j package and provides a comprehensive
    API for session management, transaction handling, and result processing.
  humanURL: https://neo4j.com/docs/python-manual/current/
  tags:
  - Python
  - SDK
  - Driver
  - Graph Database
  - Bolt
  properties:
  - type: Documentation
    url: https://neo4j.com/docs/python-manual/current/
  - type: Documentation
    url: https://neo4j.com/docs/api/python-driver/current/
- aid: neo4j:java-driver
  name: Neo4j Java Driver
  description: >-
    The Neo4j Java Driver is the official library for connecting Java applications to Neo4j graph databases.
    Distributed via Maven, it uses the Bolt protocol for network communication and supports both single
    instance and clustered database configurations. The driver provides a full API for managing connections,
    sessions, transactions, and query results within Java applications.
  humanURL: https://neo4j.com/docs/java-manual/current/
  tags:
  - Java
  - SDK
  - Driver
  - Graph Database
  - Bolt
  properties:
  - type: Documentation
    url: https://neo4j.com/docs/java-manual/current/
  - type: Documentation
    url: https://neo4j.com/docs/api/java-driver/current/
- aid: neo4j:javascript-driver
  name: Neo4j JavaScript Driver
  description: >-
    The Neo4j JavaScript Driver is the official library for interacting with Neo4j graph databases from
    JavaScript and Node.js applications. It uses the Bolt protocol for efficient communication and can
    be installed via npm. The driver supports both browser and server-side environments and provides APIs
    for session management, transaction control, and processing of query results from Neo4j databases.
  humanURL: https://neo4j.com/docs/javascript-manual/current/
  tags:
  - JavaScript
  - SDK
  - Driver
  - Graph Database
  - Bolt
  - Node.js
  properties:
  - type: Documentation
    url: https://neo4j.com/docs/javascript-manual/current/
  - type: Documentation
    url: https://neo4j.com/docs/api/javascript-driver/current/
