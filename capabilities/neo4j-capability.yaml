    - path: /instances/{instanceId}/snapshots
      name: listsnapshots
      operations:
      - method: GET
        name: listsnapshots
        description: List snapshots for an instance
        call: neo4j.listsnapshots
        outputParameters:
        - type: object
          mapping: $.
    - path: /instances/{instanceId}/snapshots
      name: createsnapshot
      operations:
      - method: POST
        name: createsnapshot
        description: Create a snapshot
        call: neo4j.createsnapshot
        outputParameters:
        - type: object
          mapping: $.
    - path: /instances/{instanceId}/snapshots/{snapshotId}
      name: getsnapshot
      operations:
      - method: GET
        name: getsnapshot
        description: Get snapshot details
        call: neo4j.getsnapshot
        outputParameters:
