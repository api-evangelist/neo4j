naftiko: 1.0.0-alpha2
info:
  label: Neo4j Aura API
  description: 'The Neo4j Aura API provides programmatic access to manage Neo4j AuraDB cloud database instances. It supports
    operations across three primary resources: instances, tenants, and snapshots. Developers authenticate using OAuth2 bearer
    tokens obtained through client credentials, and can automate the provisioning, configuration, and management of their
    cloud-hosted Neo4j graph databases. The API is accessible through the api.neo4j.io platform and is available to Aura Enterprise
    customers.'
  tags:
  - Neo4j
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: neo4j
    baseUri: https://api.neo4j.io/v1
    description: Neo4j Aura API HTTP API.
    authentication:
      type: bearer
      token: '{{NEO4J_TOKEN}}'
    resources:
    - name: oauth-token
      path: /oauth/token
      operations:
      - name: getaccesstoken
        method: POST
        description: Obtain an OAuth2 access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instances
      path: /instances
      operations:
      - name: listinstances
        method: GET
        description: List all instances
        inputParameters:
        - name: tenantId
          in: query
          type: string
          description: Filter instances by tenant ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createinstance
        method: POST
        description: Create a new instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instances-instanceid
      path: /instances/{instanceId}
      operations:
      - name: getinstance
        method: GET
        description: Get instance details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateinstance
        method: PATCH
        description: Update an instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteinstance
        method: DELETE
        description: Delete an instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instances-instanceid-pause
      path: /instances/{instanceId}/pause
      operations:
      - name: pauseinstance
        method: POST
        description: Pause an instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instances-instanceid-resume
      path: /instances/{instanceId}/resume
      operations:
      - name: resumeinstance
        method: POST
        description: Resume a paused instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instances-instanceid-overwrite
      path: /instances/{instanceId}/overwrite
      operations:
      - name: overwriteinstance
        method: POST
        description: Overwrite an instance from a snapshot
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: tenants
      path: /tenants
      operations:
      - name: listtenants
        method: GET
        description: List all tenants
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: tenants-tenantid
      path: /tenants/{tenantId}
      operations:
      - name: gettenant
        method: GET
        description: Get tenant details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instances-instanceid-snapshots
      path: /instances/{instanceId}/snapshots
      operations:
      - name: listsnapshots
        method: GET
        description: List snapshots for an instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsnapshot
        method: POST
        description: Create a snapshot
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instances-instanceid-snapshots-snapshotid
      path: /instances/{instanceId}/snapshots/{snapshotId}
      operations:
      - name: getsnapshot
        method: GET
        description: Get snapshot details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instances-instanceid-snapshots-snapshotid-restor
      path: /instances/{instanceId}/snapshots/{snapshotId}/restore
      operations:
      - name: restoresnapshot
        method: POST
        description: Restore a snapshot to a new instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
