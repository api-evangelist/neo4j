meters:
  - name: auradb_professional_gb_month
    description: AuraDB Professional capacity at $65 per GB RAM per month (min 1 GB).
    unit: GB-month
    aggregation: avg
    dimensions:
      - region
      - instance
      - cloud
  - name: auradb_business_critical_gb_month
    description: AuraDB Business Critical capacity at $146 per GB RAM per month (min 2 GB).
    unit: GB-month
    aggregation: avg
    dimensions:
      - region
      - instance
      - cloud
  - name: graph_analytics_gb_hours
    description: Aura Graph Analytics consumption at $0.40 per GB-hour.
    unit: GB-hour
    aggregation: sum
    dimensions:
      - region
      - workspace
  - name: virtual_dedicated_cloud
    description: AuraDB Virtual Dedicated Cloud custom-contracted instances.
    unit: instance-month
    aggregation: avg
    dimensions:
      - region
      - tenant
  - name: storage_gb_month
    description: Persistent storage co-scaled with selected instance size.
    unit: GB-month
    aggregation: avg
    dimensions:
      - instance
  - name: backups_gb_month
    description: Backup retention storage (7/30/60 days depending on tier).
    unit: GB-month
    aggregation: avg
    dimensions:
      - instance
      - tier
  - name: enterprise_subscription
    description: Self-managed Neo4j Enterprise / Infinigraph subscription seats.
    unit: month
    aggregation: sum
    dimensions:
      - edition
      - tenant
principles:
  - name: Visibility
    description: Use the Aura Console billing dashboard for per-instance GB-RAM-month and GB-hour usage;
      export billing CSV for chargeback. Self-managed customers track license metrics via Neo4j Operations
      Manager.
  - name: Allocation
    description: Tag AuraDB instances with project / team labels in the Aura Console; map workspaces in
      Aura Graph Analytics to cost centers; use separate projects per environment (dev/stage/prod).
  - name: Optimization
    description: Right-size AuraDB instances based on p95 query latency, not peak; pause non-prod instances
      during off-hours (Aura supports pausing); choose Aura Graph Analytics on-demand for batch workloads
      vs. always-on AuraDB; consolidate small graphs into one instance where governance allows.
  - name: Accountability
    description: Set per-project Aura spend ceilings; alert on instance-size upgrades; review backup
      retention against compliance requirements; review Graph Analytics GB-hour spikes monthly.
maintainers:
