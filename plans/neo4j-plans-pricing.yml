specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Neo4j
providerId: neo4j
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Graph Database
  - AuraDB
  - Cypher
  - Knowledge Graph
  - Vector Search
description: Neo4j offers a managed cloud graph database (AuraDB) priced per-GB-RAM-per-month, plus self-managed
  Community (free, GPL3) and Enterprise (sales) editions, plus Aura Graph Analytics priced per-GB-hour.
  AuraDB sizes scale memory + compute + storage together; Business Critical adds multi-zone HA, RBAC,
  SSO, and longer backup retention.
sources:
  - https://neo4j.com/pricing/
  - https://neo4j.com/cloud/aura-aws/
plans:
  - id: neo4j-auradb-free
    name: AuraDB Free
    type: freemium
    description: Free managed AuraDB instance for learning and exploration. No credit card required.
    entries:
      - label: Free instance
        name: free_instance
        type: flat
        metric: month
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Limited node / relationship counts
      - name: All graph tools access
      - name: No credit card required
  - id: neo4j-auradb-professional
    name: AuraDB Professional
    type: usage-based
    description: Production-ready managed AuraDB. Priced per GB of RAM per month, minimum 1 GB. 14-day
      free trial available.
    entries:
      - label: Professional GB-RAM-month
        name: professional_gb_ram
        type: metered
        metric: gb_ram
        limit: 128
        timeFrame: month
        geo: global
        unit: 1
        price: '65.00'
        userMultiplied: false
    elements:
      - name: Up to 128 GB RAM
      - name: 1-12 CPU cores (scales with size)
      - name: 2-128 GB storage
      - name: Daily backups, 7-day retention
      - name: Best-effort support
  - id: neo4j-auradb-business-critical
    name: AuraDB Business Critical
    type: usage-based
    description: Enterprise-scale managed AuraDB with multi-zone HA, premium support, and security controls.
      Minimum 2 GB.
    entries:
      - label: Business Critical GB-RAM-month
        name: business_critical_gb_ram
        type: metered
        metric: gb_ram
        limit: 512
        timeFrame: month
        geo: global
        unit: 1
        price: '146.00'
        userMultiplied: false
    elements:
      - name: Up to 512 GB RAM
      - name: 1-96 CPU cores
      - name: 4-1024 GB storage
      - name: 99.95% uptime SLA, multi-zone
      - name: Daily backups, 30-day retention, hourly point-in-time restore
      - name: 24/7 premium support, one-hour response
      - name: RBAC, SSO, IP filtering, property-based access control
  - id: neo4j-auradb-virtual-dedicated
    name: AuraDB Virtual Dedicated Cloud
    type: enterprise
    description: Dedicated VPC-isolated AuraDB infrastructure. Custom pricing.
    entries:
      - label: Custom contract
        name: vdc_contract
        type: subscription
        metric: month
        limit: 512
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Up to 512 GB RAM
      - name: Dedicated infrastructure with VPC isolation
      - name: Hourly backups, 60-day retention
      - name: 24/7 enhanced support
  - id: neo4j-graph-analytics
    name: Aura Graph Analytics
    type: usage-based
    description: Pay-as-you-go or prepaid graph analytics priced per GB-hour. Works against any data source
      without ETL.
    entries:
      - label: GB-hour
        name: graph_analytics_gb_hour
        type: metered
        metric: gb_hour
        limit: 512
        timeFrame: hour
        geo: global
        unit: 1
        price: '0.40'
        userMultiplied: false
    elements:
      - name: Up to 512 GB RAM
      - name: Pay-as-you-go or prepaid
      - name: Works with any data source
  - id: neo4j-community
    name: Community Edition (Self-Managed)
    type: freemium
    description: GPL3-licensed self-hosted Neo4j for learning and non-production use.
    entries:
      - label: Self-hosted Community
        name: community_self_hosted
        type: flat
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Native graph database
      - name: Cypher language
      - name: ACID transactions
      - name: No high availability
      - name: Limited Graph Data Science (≤4 CPUs, 3 models max)
  - id: neo4j-enterprise
    name: Enterprise Edition (Self-Managed)
    type: enterprise
    description: Self-managed Neo4j Enterprise. Contact sales for pricing.
    entries:
      - label: Enterprise contract
        name: enterprise_contract
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: All Community features
      - name: Unlimited read scaling
      - name: Fine-grained access controls
      - name: High availability
      - name: Change Data Capture
      - name: Fabric federation
  - id: neo4j-infinigraph
    name: Infinigraph Edition (Self-Managed)
    type: enterprise
    description: AI-ready graph at scale. Contact sales.
    entries:
      - label: Infinigraph contract
        name: infinigraph_contract
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: All Enterprise features
      - name: Unlimited horizontal scaling with automatic sharding
      - name: Included Graph Data Science
